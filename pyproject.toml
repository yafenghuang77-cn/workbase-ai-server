[project]
name = "workbase-ai-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "broadcaster>=0.3.1",
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.19",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.6.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
